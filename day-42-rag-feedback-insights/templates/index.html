<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG Feedback Insights</title><link rel="stylesheet" href="/static/style.css"></head><body><main><p class="eyebrow">75 Days of Code · Day 42</p><h1>RAG Feedback Insights</h1><p>Find patterns in weak answers and turn feedback into improvements.</p><section id="cards" class="cards"></section><section class="panel"><h2>Quality Distribution</h2><div id="buckets"></div></section><section class="panel"><h2>Weak Topics</h2><div id="topics"></div></section><section class="panel"><h2>Recommendations</h2><ul id="recommendations"></ul></section></main><script>async function load(){const a=await fetch('/api/insights').then(r=>r.json());document.querySelector('#cards').innerHTML=[['Total Feedback',a.total_feedback],['Helpful',a.helpful],['Not Helpful',a.not_helpful],['Helpful Rate',a.helpful_rate+'%'],['Weak Queries',a.weak_query_count]].map(x=>`<div class="card"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');const labels={low:'Low (<0.50)',medium:'Medium (0.50–0.74)',high:'High (≥0.75)'};document.querySelector('#buckets').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="metric"><strong>${v}</strong><span>${a.quality_buckets[k]||0}</span></div>`).join('');document.querySelector('#topics').innerHTML=a.weak_topics.length?a.weak_topics.map(([w,n])=>`<span class="tag">${w} · ${n}</span>`).join(''):'<p>No weak topics detected.</p>';document.querySelector('#recommendations').innerHTML=a.recommendations.map(x=>`<li>${x}</li>`).join('')}load();</script></body></html>
