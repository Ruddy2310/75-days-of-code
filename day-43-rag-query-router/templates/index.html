<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG Query Router</title><link rel="stylesheet" href="/static/style.css"></head><body><main><p class="eyebrow">75 Days of Code · Day 43</p><h1>RAG Query Router</h1><p>Classify a query and select a retrieval strategy.</p><section class="panel"><form id="form"><textarea id="query" placeholder="Enter a question..." required></textarea><button>Route Query</button></form></section><section id="result" class="panel hidden"></section><section class="panel"><h2>Examples</h2><div id="examples"></div></section></main><script>const q=document.querySelector('#query');const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function route(){if(!q.value.trim())return;let d=await fetch('/api/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q.value})}).then(r=>r.json());let e=document.querySelector('#result');e.classList.remove('hidden');e.innerHTML=d.error?d.error:`<p class="label">ROUTE</p><h2>${esc(d.route)}</h2><p><b>Strategy:</b> ${esc(d.strategy)}</p><p><b>Confidence:</b> ${d.confidence}</p><p>${esc(d.description)}</p><pre>${JSON.stringify(d.route_scores,null,2)}</pre>`}document.querySelector('#form').onsubmit=e=>{e.preventDefault();route()};fetch('/api/examples').then(r=>r.json()).then(xs=>document.querySelector('#examples').innerHTML=xs.map(x=>`<button class="example" data-q="${x.replaceAll('"','&quot;')}">${x}</button>`).join('')).then(()=>document.querySelectorAll('.example').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;route()}));</script></body></html>
