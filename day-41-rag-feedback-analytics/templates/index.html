<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAG Feedback Analytics</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<p class="eyebrow">75 Days of Code · Day 41</p>
<h1>RAG Feedback Analytics</h1>
<p>Turn user feedback into actionable RAG quality signals.</p>

<section id="cards" class="cards"></section>

<section class="panel">
<h2>Feedback Trend</h2>
<div id="trend"></div>
</section>

<section class="panel">
<h2>Low-Rated Queries</h2>
<div id="low"></div>
</section>

<section class="panel">
<h2>Recent Feedback</h2>
<div id="recent"></div>
</section>
</main>

<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>(
{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

async function load(){
 const a=await fetch('/api/analytics').then(r=>r.json());

 document.querySelector('#cards').innerHTML=[
  ['Total Feedback',a.total_feedback],
  ['Helpful',a.helpful],
  ['Not Helpful',a.not_helpful],
  ['Helpful Rate',a.helpful_rate+'%'],
  ['Average Quality',a.average_quality??'—']
 ].map(x=>`<div class="card"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');

 const days=Object.entries(a.daily_feedback);
 document.querySelector('#trend').innerHTML=days.length
 ? days.map(([d,n])=>`<div class="bar"><b>${d}</b><span style="width:${Math.min(n*80,100)}%">${n}</span></div>`).join('')
 : '<p>No trend data.</p>';

 document.querySelector('#low').innerHTML=a.low_rated_queries.length
 ? a.low_rated_queries.map(x=>`<article><b>👎 ${esc(x.query)}</b>
 <small>Quality: ${x.quality_score??'—'}</small></article>`).join('')
 : '<p>No low-rated queries.</p>';

 const rows=await fetch('/api/feedback').then(r=>r.json());
 document.querySelector('#recent').innerHTML=rows.slice(0,10).map(r=>
 `<article><b>${r.rating==='up'?'👍':'👎'} ${esc(r.query)}</b>
 <p>${esc(r.answer)}</p>
 <small>${new Date(r.timestamp).toLocaleString()} · quality: ${r.quality_score??'—'}</small>
 </article>`).join('');
}
load();
</script>
</body>
</html>
